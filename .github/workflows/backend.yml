name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        env:
          PYTHONPATH: "."
          SUPABASE_URL: "https://example.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key"
          CREDENTIALS_ENCRYPTION_KEY: "Mfear1jGOKTHAyygnliDjtvlxWeKatMS_76XNrjbaos="
        # Discovers both backend/tests/ (admin API) and backend/worker/tests/ (pipeline)
        run: pytest -q

  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t news-backend:${{ github.sha }} backend
      - name: Trigger Render/Railway deploy hook
        if: ${{ secrets.BACKEND_DEPLOY_HOOK_URL != '' }}
        env:
          BACKEND_DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$BACKEND_DEPLOY_HOOK_URL"
