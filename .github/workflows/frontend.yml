name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build
        env:
          # Placeholder values so the build's static generation step doesn't fail on missing env
          # vars — actual deployment env vars are configured in Netlify's site settings.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_BACKEND_API_URL: http://localhost:8000
        run: npm run build

# Actual deployment is handled by Netlify's GitHub integration (auto-deploys on push once the
# site is connected, base directory "frontend") — this workflow is a CI gate, not a deploy step.
